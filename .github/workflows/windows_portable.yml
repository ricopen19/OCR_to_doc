name: windows-portable

on:
  workflow_dispatch:
    inputs:
      with_runtime:
        description: "Bundle Python runtime (resources/python) into the portable zip (large)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri (Windows)
        working-directory: ui
        run: |
          npm ci --legacy-peer-deps
          npm run tauri:build

      - name: Assemble portable directory
        run: |
          $ErrorActionPreference = "Stop"

          $outRoot = Join-Path $PWD "dist-portable"
          $appDir = Join-Path $outRoot "ocr-to-doc"
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null

          # Pick the built exe
          $releaseDir = Join-Path $PWD "ui/src-tauri/target/release"
          if (-not (Test-Path $releaseDir)) { throw "release dir not found: $releaseDir" }
          $exeCandidates = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File
          if (-not $exeCandidates) { throw "no exe found in $releaseDir" }

          $picked = $exeCandidates | Where-Object { $_.Name -eq "ocr-to-doc.exe" } | Select-Object -First 1
          if (-not $picked) { $picked = $exeCandidates | Select-Object -First 1 }

          Copy-Item -Force -Path $picked.FullName -Destination (Join-Path $appDir "ocr-to-doc.exe")

          # Copy side-by-side dlls if any (some builds need these next to the exe)
          Get-ChildItem -Path $releaseDir -Filter "*.dll" -File | ForEach-Object {
            Copy-Item -Force -Path $_.FullName -Destination $appDir
          }

          # App configs (UI settings)
          if (Test-Path "configs") {
            Copy-Item -Recurse -Force -Path "configs" -Destination $appDir
          }

          # セットアップ / アンインストールバッチ
          foreach ($bat in @("setup.bat", "uninstall.bat")) {
            if (Test-Path $bat) {
              Copy-Item -Force -Path $bat -Destination $appDir
            } else {
              throw "$bat not found at repo root"
            }
          }

          # Python scripts are placed under scripts/python (matches paths.rs resolution)
          $pyDir = Join-Path $appDir "scripts/python"
          New-Item -ItemType Directory -Force -Path $pyDir | Out-Null
          Copy-Item -Force -Path "scripts/python/*.py" -Destination $pyDir

          # Poppler: CI 上でダウンロード・展開（setup.bat と同じバージョン）
          $popplerVer = "24.02.0-0"
          $popplerUrl = "https://github.com/oschwartz10612/poppler-Windows/releases/download/v$popplerVer/Release-$popplerVer.zip"
          $popplerZip = Join-Path $env:TEMP "poppler-windows.zip"
          $popplerExtract = Join-Path $env:TEMP "poppler-extract"
          Write-Host "Downloading Poppler $popplerVer..."
          Invoke-WebRequest -Uri $popplerUrl -OutFile $popplerZip -UseBasicParsing
          Expand-Archive -Path $popplerZip -DestinationPath $popplerExtract -Force
          $popplerSrc = (Get-ChildItem $popplerExtract -Directory | Select-Object -First 1).FullName
          $popplerDst = Join-Path $appDir "poppler"
          New-Item -ItemType Directory -Force -Path $popplerDst | Out-Null
          Copy-Item -Recurse -Force -Path "$popplerSrc\*" -Destination $popplerDst
          Remove-Item -Force $popplerZip
          Remove-Item -Recurse -Force $popplerExtract
          Write-Host "Poppler installed to $popplerDst"

      - name: (Optional) Setup Python for runtime bundling
        if: ${{ github.event.inputs.with_runtime == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: (Optional) Bundle portable Python runtime
        if: ${{ github.event.inputs.with_runtime == 'true' }}
        run: |
          $ErrorActionPreference = "Stop"

          # 1) Copy Python runtime itself into the portable directory (no user PATH required)
          $appDir = Join-Path $PWD "dist-portable/ocr-to-doc"
          $runtimeDir = Join-Path $appDir "resources/python"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null

          $pyExe = (python -c "import sys; print(sys.executable)").Trim()
          if (-not (Test-Path $pyExe)) { throw "python.exe not found: $pyExe" }
          $pyHome = Split-Path -Parent $pyExe

          Copy-Item -Recurse -Force -Path "$pyHome/*" -Destination $runtimeDir

          # 2) Generate requirements from pyproject.toml (avoid poetry.lock mismatch issues)
          $py = @'
          import re
          import tomllib
          from pathlib import Path
          
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          
          deps = data.get("project", {}).get("dependencies", [])
          if not deps:
              raise SystemExit("no dependencies found in [project].dependencies")
          
          def normalize(dep: str) -> str:
              # e.g. "yomitoku (>=0.10.1,<0.11.0)" -> ("yomitoku", ">=0.10.1,<0.11.0")
              m = re.match(r"^([^ ]+)(?: \(([^)]+)\))?$", dep.strip())
              if not m:
                  return dep.strip()
              name = m.group(1)
              spec = m.group(2)
              return f"{name}{spec}" if spec else name
          
          seen = set()
          out = []
          for d in deps:
              n = normalize(d)
              if n not in seen:
                  seen.add(n)
                  out.append(n)
          
          Path("requirements-runtime.txt").write_text("\n".join(out) + "\n", encoding="utf-8")
          print("wrote requirements-runtime.txt with", len(out), "lines")
          '@
          python -c $py

          # 3) Install runtime dependencies into the bundled Python
          $runtimePy = Join-Path $runtimeDir "python.exe"
          if (-not (Test-Path $runtimePy)) { throw "bundled python.exe not found: $runtimePy" }
          & $runtimePy -m ensurepip --upgrade
          & $runtimePy -m pip install --upgrade pip
          & $runtimePy -m pip install -r requirements-runtime.txt

          # Quick sanity checks for deps used by the app
          & $runtimePy -c "import docx, openpyxl; print('runtime imports ok')"

      - name: Prepare fixture
        if: ${{ github.event.inputs.with_runtime == 'true' }}
        run: |
          $ErrorActionPreference = "Stop"
          $appDir = Join-Path $PWD "dist-portable/ocr-to-doc"
          $fixtureDir = Join-Path $appDir "resources/fixtures"
          $fixturePyDir = Join-Path $appDir "resources/py/fixtures"
          New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
          New-Item -ItemType Directory -Force -Path $fixturePyDir | Out-Null

          $b64 = (Get-Content "tests/fixtures/sample.png.b64" -Raw).Trim()
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes((Join-Path $fixtureDir "sample.png"), $bytes)
          [IO.File]::WriteAllBytes((Join-Path $fixturePyDir "sample.png"), $bytes)

      - name: Self-test portable exe
        if: ${{ github.event.inputs.with_runtime == 'true' }}
        run: |
          $ErrorActionPreference = "Stop"
          $appDir = Join-Path $PWD "dist-portable/ocr-to-doc"
          $exe = Join-Path $appDir "ocr-to-doc.exe"
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          Write-Host "=== fixtures ==="
          Get-ChildItem -Recurse (Join-Path $appDir "resources/fixtures") -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse (Join-Path $appDir "resources/py/fixtures") -ErrorAction SilentlyContinue
          $fixture = Join-Path $appDir "resources/fixtures/sample.png"
          if (-not (Test-Path $fixture)) { throw "fixture not found: $fixture" }
          $resultDir = Join-Path $appDir "result_ci"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $outLog = Join-Path $appDir "self_test.stdout.txt"
          $errLog = Join-Path $appDir "self_test.stderr.txt"
          $pwshLog = Join-Path $resultDir "self_test.pwsh.txt"
          if (Test-Path $outLog) { Remove-Item -Force $outLog }
          if (Test-Path $errLog) { Remove-Item -Force $errLog }
          if (Test-Path $pwshLog) { Remove-Item -Force $pwshLog }
          try {
            "exe=$exe" | Set-Content -Path $pwshLog
            "fixture=$fixture" | Add-Content -Path $pwshLog
            $proc = Start-Process -FilePath $exe -ArgumentList "--self-test", "--input", $fixture -Wait -PassThru -NoNewWindow -RedirectStandardOutput $outLog -RedirectStandardError $errLog
            $code = $proc.ExitCode
          } catch {
            $code = 1
            ($_ | Out-String) | Add-Content -Path $pwshLog
          }
          if (-not (Test-Path $pwshLog)) {
            "exitcode=$code" | Set-Content -Path $pwshLog
          } else {
            "exitcode=$code" | Add-Content -Path $pwshLog
          }
          "=== result_ci contents ===" | Add-Content -Path $pwshLog
          (Get-ChildItem -Recurse $resultDir -ErrorAction SilentlyContinue | Out-String) | Add-Content -Path $pwshLog
          if (Test-Path $outLog) { Copy-Item -Force $outLog $resultDir }
          if (Test-Path $errLog) { Copy-Item -Force $errLog $resultDir }
          if ($null -eq $code) { $code = 1 }
          if ($code -ne 0) {
            $ciDir = Join-Path $appDir "result_ci"
            if (Test-Path $errLog) {
              Write-Host "=== self_test.stderr.txt (tail) ==="
              Get-Content $errLog -Tail 200
            }
            if (Test-Path $outLog) {
              Write-Host "=== self_test.stdout.txt (tail) ==="
              Get-Content $outLog -Tail 200
            }
            throw "self-test failed with exit code $code"
          }

      - name: Upload self-test logs
        if: ${{ always() && (github.event.inputs.with_runtime == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: self-test-logs
          path: |
            dist-portable/ocr-to-doc/self_test.stdout.txt
            dist-portable/ocr-to-doc/self_test.stderr.txt
            dist-portable/ocr-to-doc/self_test.trace.txt
          if-no-files-found: ignore

      - name: Upload self-test result_ci
        if: ${{ always() && (github.event.inputs.with_runtime == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: self-test-result-ci
          path: dist-portable/ocr-to-doc/result_ci
          if-no-files-found: ignore

      - name: Create zip
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "ocr-to-doc-portable-windows.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path "dist-portable/ocr-to-doc" -DestinationPath $zip

      - name: Upload artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ocr-to-doc-portable-windows
          path: ocr-to-doc-portable-windows.zip
